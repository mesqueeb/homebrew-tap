name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before
        if: github.event_name == 'pull_request' || matrix.os != 'macos-15-intel'

      - run: brew test-bot --only-setup
        if: github.event_name == 'pull_request' || matrix.os != 'macos-15-intel'

      - run: brew test-bot --only-tap-syntax
        if: matrix.os != 'macos-15-intel'

      - name: Install and test Pigeon on Intel
        if: github.event_name == 'push' && matrix.os == 'macos-15-intel'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install mesqueeb/tap/pigeon
          brew test mesqueeb/tap/pigeon

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
